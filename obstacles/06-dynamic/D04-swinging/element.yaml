# D04 — Качающееся подвешенное препятствие
# Общие поля элемента. Вариант может переопределить любое из них.
id: D04
name_ru: "Качающееся подвешенное препятствие"
name_en: "Swinging obstacle"
category: dynamic
scope: track            # track | indoor | outdoor | service
behavior: dynamic       # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Тканевое кольцо Ø400 (лента 50 мм), подвешенное к потолку на двух шнурах (как G11),
  раскачивается вперёд-назад вдоль направления полёта. Точка подвеса на высоте 2500 мм,
  центр кольца в покое на 1200 мм.
real_analog: "подвешенное кольцо, раскачанное толчком"
components: "G11 в режиме качания"   # из каких элементов каталога собран
mount: hanging         # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь, нейлоновый шнур"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "жёлтое #FFC400"
difficulty: 3          # 1–5
motion:               # только для dynamic
  type: "swing"       # rotation | swing | linear | open-close
  axis: "x"           # ось вращения/движения: x | y | z
  period_s: 2.3       # период полного цикла, с
  amplitude: "±20°"   # угол (°) или ход (мм)
  note: "качание вдоль полёта; кольцо наклоняется и смещается на ±445 мм"
notes: >-
  Кольцо то приближается, то удаляется и наклоняется — видимый проём «дышит». Период
  соответствует маятнику 1,3 м. В реальности качание затухает, в симуляторе — постоянное.

