# D01 — Вращающиеся ворота
# Общие поля элемента. Вариант может переопределить любое из них.
id: D01
name_ru: "Вращающиеся ворота"
name_en: "Rotating gate"
category: dynamic
scope: track            # track | indoor | outdoor | service
behavior: dynamic       # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Квадратные тканевые ворота 500×500 (лента 50 мм) на вертикальной оси: снизу трубка Ø25 мм
  от моторного основания 250×250×120 мм до нижней кромки ворот на высоте 300 мм. Ворота
  непрерывно вращаются вокруг вертикальной оси, проходящей через их центр.
real_analog: "вращающиеся ворота на мотор-редукторе"
components: "G03-c на поворотном основании"   # из каких элементов каталога собран
mount: floor           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; основание — пластик, мотор-редуктор"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "ворота бирюзовые #00ACC1, основание чёрное #212121"
difficulty: 4          # 1–5
motion:               # только для dynamic
  type: "rotation"    # rotation | swing | linear | open-close
  axis: "y"           # ось вращения/движения: x | y | z
  period_s: 6         # период полного цикла, с
  amplitude: "360°, непрерывно" # угол (°) или ход (мм)
  passable: "нормаль ворот в пределах ±30° от направления полёта — окно 2 раза за оборот, по ~1 с"
notes: >-
  Пилот ловит момент, когда ворота развёрнуты к нему. Видимая ширина проёма =
  400·|cos(угол)|. Скорость вращения — параметр: 6 с на оборот для обучения, 3 с — сложно.

