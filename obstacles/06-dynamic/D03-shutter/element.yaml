# D03 — Подвижная заслонка
# Общие поля элемента. Вариант может переопределить любое из них.
id: D03
name_ru: "Подвижная заслонка"
name_en: "Shutter"
category: dynamic
scope: track            # track | indoor | outdoor | service
behavior: dynamic       # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Жёсткая квадратная рамка 600×600 мм (профиль 100 мм, проём 400×400, нижний край рамки на
  100 мм) на двух ножках. По верхней направляющей, продлённой вправо на 500 мм, ездит
  сдвижная дверь 420×420 мм: закрыта — перекрывает проём, открыта — уезжает вправо за рамку.
real_analog: "ворота со сдвижной дверью на линейном приводе"
mount: floor           # floor | stand | hanging | wall | free
material: "рамка — фанера/пластик, дверь — пенокартон, линейный привод"
rigidity: hard         # soft | semi | hard — поведение при ударе вупа
color: "рамка белая #FAFAFA, дверь красная #E53935 с жёлтой каймой #FFD600"
difficulty: 4          # 1–5
motion:               # только для dynamic
  type: "open-close"  # rotation | swing | linear | open-close
  axis: "x"           # ось вращения/движения: x | y | z
  period_s: 6         # период полного цикла, с
  amplitude: "ход 420 мм" # угол (°) или ход (мм)
  cycle: "открыто 2 с → закрывается 1 с → закрыто 2 с → открывается 1 с"
notes: >-
  Пилот подгадывает пролёт под открытую фазу. В симуляторе цикл и ход — параметры; можно
  рандомизировать фазу, чтобы её нельзя было выучить.

