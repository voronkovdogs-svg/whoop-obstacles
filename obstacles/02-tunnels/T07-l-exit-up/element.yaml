# T07 — Тоннель с выходом вверх
# Общие поля элемента. Вариант может переопределить любое из них.
id: T07
name_ru: "Тоннель с выходом вверх"
name_en: "L-tunnel, exit up"
category: tunnels
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Тканевый тоннель Ø450: горизонтальный участок 1000 мм по полу, затем изгиб вверх на 90°
  (радиус по оси 450 мм) и вертикальный участок 600 мм. Выход смотрит в потолок на высоте
  1275 мм. Вертикальную часть держит стойка с двумя хомутами, стоящая за тоннелем.
real_analog: "игровой тоннель, закреплённый на стойке"
mount: floor           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; стойка — алюминий"
rigidity: soft         # soft | semi | hard — поведение при ударе вупа
color: "фиолетовый #8E24AA, окантовка торцов жёлтая #FFC400"
difficulty: 4          # 1–5
notes: >-
  На изгибе нужно поднять нос и добавить газ, выход не виден до последнего момента. После
  выхода дрон летит вверх — нужен запас высоты до потолка (от 1 м).

