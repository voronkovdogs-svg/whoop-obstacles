description: >-
  Входной тканевый рукав Ø450 длиной 800 мм, после которого тоннель раздваивается на две
  ветви по 800 мм, расходящиеся на 30° влево и вправо. Ветви сшиты общей тканевой муфтой,
  между ними — перегородка. Лежит на полу.
