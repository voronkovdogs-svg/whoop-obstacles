description: >-
  Ряд одинаковых тканевых колец Ø500 (лента 50 мм, как G01-c) на подставках-зажимах,
  установленных соосно с шагом 400 мм. Стенок нет: коридор просматривается насквозь и сбоку.
real_analog: "ряд складных тканевых ворот"
mount: stand           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; подставки — пластик"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "кольца чередуются: оранжевый #FF6A00 / белый #F5F5F5"
difficulty: 2          # 1–5
notes: >-
  Тренирует удержание прямой линии и высоты на скорости. Шаг можно менять; при шаге больше
  600 мм это уже просто ряд ворот.

