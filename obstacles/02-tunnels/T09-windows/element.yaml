color: "синий #1E88E5, окантовка окон белая #FFFFFF"
difficulty: 3          # 1–5
notes: >-
  Два способа прохождения: насквозь (сложность 2) или с выходом через боковое окно
  (сложность 4–5: резкий поворот внутри узкого тоннеля). Окна дают свет внутрь.

