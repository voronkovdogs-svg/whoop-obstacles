description: >-
  Тканевый тоннель Ø450 длиной 1800 мм (как T01). В боковых стенках по два круглых окна Ø250
  мм — слева и справа, центры на 600 и 1200 мм от входа на высоте оси (225 мм). Края окон
  обшиты эластичной окантовкой.
real_analog: "игровой тоннель с окнами"
mount: floor           # floor | stand | hanging | wall | free
