# T01 — Прямой тканевый тоннель
# Общие поля элемента. Вариант может переопределить любое из них.
id: T01
name_ru: "Прямой тканевый тоннель"
name_en: "Straight fabric tunnel"
category: tunnels
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Детский игровой тоннель: спираль из пружинной стальной проволоки с шагом 150 мм, обтянутая
  плотной полиэстеровой тканью. Лежит на полу, оба торца открыты, края торцов окантованы
  контрастной лентой. В реальности сечение слегка проседает под своим весом, в симуляторе
  считаем его круглым.
real_analog: "детский складной игровой тоннель"
mount: floor           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь"
rigidity: soft         # soft | semi | hard — поведение при ударе вупа
color: "синий #1E88E5, окантовка торцов жёлтая #FFC400"
difficulty: 2          # 1–5
notes: >-
  Внутри темно: камера вупа подстраивает экспозицию, на выходе возможна засветка. Чтобы
  тоннель не катался, по бокам кладут мешочки-утяжелители.

