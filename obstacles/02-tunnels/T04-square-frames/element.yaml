# T04 — Квадратный тоннель из рамок
# Общие поля элемента. Вариант может переопределить любое из них.
id: T04
name_ru: "Квадратный тоннель из рамок"
name_en: "Square frame tunnel"
category: tunnels
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Четыре П-образные рамки из ПВХ-трубы 20 мм (500×500 снаружи) с шагом 500 мм, сверху и по
  бокам обтянуты непрозрачной тканью. Пола нет — тоннель стоит на полу открытым низом.
  Входная и выходная рамки обмотаны жёлтой лентой.
real_analog: "самодельный тоннель из ПВХ-рамок и ткани"
mount: floor           # floor | stand | hanging | wall | free
