# M01 — Флаг-парус
# Общие поля элемента. Вариант может переопределить любое из них.
id: M01
name_ru: "Флаг-парус"
name_en: "Beach flag"
category: markers
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Тканевый флаг в форме паруса на гибком стеклопластиковом древке. Передняя кромка паруса
  пришита к древку, верх плавно скруглён к задней кромке, низ паруса — горизонтальный.
  Древко вставлено в круглое утяжелённое основание высотой 30 мм.
real_analog: "рекламный флаг-парус (beach flag), уменьшенный"
mount: floor           # floor | stand | hanging | wall | free
material: "полиэстер, стеклопластик; основание — резина/пластик с утяжелителем"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "парус красный #E53935, древко белое"
difficulty: 1          # 1–5
notes: >-
  Огибаемый ориентир: проёма нет. Парус большой и лёгкий — при касании дрон сминает ткань, а
  древко пружинит. Ставят на поворотах трассы и как заметную точку разворота.

