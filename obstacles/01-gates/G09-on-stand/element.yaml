rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "красный #D32F2F, стойка чёрная"
difficulty: 2          # 1–5
notes: >-
  Стойка жёсткая (hard), ворота — semi. Высокие ворота хорошо сочетать с низкими для
  перепадов высоты на трассе.

