description: >-
  Квадратные тканевые ворота 500×500 (лента 50 мм) на вертикальной стойке: алюминиевая труба
  Ø20 мм, крестовина-основание 400×400 мм. Ворота крепятся к стойке хомутами за боковую
  сторону, стойка стоит сбоку от проёма.
real_analog: "тканевые ворота на телескопической стойке"
mount: stand           # floor | stand | hanging | wall | free
