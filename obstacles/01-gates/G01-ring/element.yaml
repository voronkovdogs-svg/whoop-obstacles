# G01 — Круглое кольцо
# Общие поля элемента. Вариант может переопределить любое из них.
id: G01
name_ru: "Круглое кольцо"
name_en: "Ring gate"
category: gates
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Кольцо из пружинной стальной проволоки в тканевом чехле-ленте. Лента плоская, лежит в
  плоскости кольца, толщина около 8 мм. Кольцо стоит вертикально в утяжелённой
  подставке-зажиме 160×100×25 мм, нижняя точка кольца на высоте 20 мм над полом. Плоскость
  кольца перпендикулярна направлению пролёта.
real_analog: "складные тканевые ворота для вупов (pop-up gate)"
mount: stand           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; подставка — пластик с утяжелителем"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "оранжевый #FF6A00"
difficulty: 2          # 1–5
notes: >-
  Подпись варианта — внешний диаметр. Проём = внешний диаметр минус две ширины ленты. При
  ударе кольцо прогибается и пружинит, дрон обычно отскакивает, а не застревает.

