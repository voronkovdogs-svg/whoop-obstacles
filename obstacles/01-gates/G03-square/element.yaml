description: >-
  Квадратная рамка из пружинной стальной проволоки в тканевом чехле-ленте, углы слегка
  скруглены (R 20 мм). Стоит на полу нижней стороной, устойчивость дают две Г-образные
  проволочные лапки глубиной 200 мм (по 100 мм вперёд и назад). По краю проёма —
  светоотражающая окантовка 5 мм.
