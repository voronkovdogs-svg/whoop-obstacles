# G08 — Наклонные ворота
# Общие поля элемента. Вариант может переопределить любое из них.
id: G08
name_ru: "Наклонные ворота"
name_en: "Tilted gate"
category: gates
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Квадратные тканевые ворота 500×500 (как G03-c), закреплённые нижней стороной на шарнирной
  раме 500×300 мм. Верх ворот отклонён назад, от подлетающего дрона, на заданный угол, сзади
  — упор-распорка.
real_analog: "тканевые ворота на раме с регулируемым наклоном"
mount: floor           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; рама — алюминиевый профиль"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "фиолетовый #8E24AA"
difficulty: 2          # 1–5
notes: >-
  Наклон — поворот вокруг оси X (верх уходит назад). При горизонтальном пролёте видимая
  высота проёма = 400·cos(угол) — поле effective_height. Вариант с боковым наклоном (крен)
  можно добавить позже.

