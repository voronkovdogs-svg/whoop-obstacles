# C05 — Башня
# Общие поля элемента. Вариант может переопределить любое из них.
id: C05
name_ru: "Башня"
name_en: "Tower"
category: combos
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Центральная стойка Ø40 мм высотой 1900 мм на основании 500×500 мм. На горизонтальных
  консолях длиной 400 мм закреплены трое ворот 400×400 через каждые 90° по кругу и на разной
  высоте: 1-е — нижний край 100 мм, 2-е — 700 мм, 3-и — 1300 мм. Плоскость каждых ворот
  проходит через ось стойки, центр ворот в 600 мм от оси.
real_analog: "многоуровневая башня-спираль"
components: "3 × G03-b на консолях центральной стойки"   # из каких элементов каталога собран
mount: stand           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; стойка и консоли — алюминий"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "ворота 1 — зелёные #43A047, 2 — жёлтые #FDD835, 3 — красные #E53935; стойка серая #9E9E9E"
difficulty: 4          # 1–5
notes: >-
  Проходится по восходящей спирали против часовой стрелки (вид сверху) радиусом около 600
  мм. Стойка в центре жёсткая — главный риск при срезании.

