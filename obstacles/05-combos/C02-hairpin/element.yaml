description: >-
  Двое квадратных ворот 500×500 стоят рядом в одной линии, лицом в одну сторону, между
  центрами 1000 мм. За ними по оси на расстоянии 900 мм — поворотный мягкий шест (M05).
  Пролёт в левые ворота, разворот вокруг шеста и возврат через правые.
