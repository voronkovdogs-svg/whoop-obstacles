description: >-
  Квадратные тканевые ворота 400×400 (лента 50 мм) одни над другими с шагом 650 мм, на двух
  стойках Ø25 мм с Т-ножками глубиной 300 мм. Нижний край нижних ворот на высоте 100 мм.
real_analog: "гоночная «лестница» (ladder)"
components: "2–3 × G03-b (400×400) на общей раме"   # из каких элементов каталога собран
mount: stand           # floor | stand | hanging | wall | free
material: "полиэстер, пружинная сталь; стойки — алюминий"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "ворота снизу вверх: зелёные #43A047 / жёлтые #FDD835 / красные #E53935; стойки чёрные #212121"
difficulty: 3          # 1–5
notes: >-
  Подъём зигзагом: через нижние ворота вперёд, разворот с набором высоты, через следующие —
  назад, и так далее. Обратное направление (сверху вниз) — серия split-S, сложнее.

