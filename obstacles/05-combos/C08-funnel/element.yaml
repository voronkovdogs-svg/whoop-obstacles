description: >-
  Трое квадратных ворот по одной оси с шагом 800 мм, каждые следующие меньше: 500×500,
  400×400, 300×300 (проёмы 400, 300, 220 мм). Все стоят на полу, поэтому центр проёма с
  каждыми воротами чуть ниже.
real_analog: "последовательность ворот уменьшающегося размера"
