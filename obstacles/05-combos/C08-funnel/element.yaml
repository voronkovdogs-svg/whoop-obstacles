# C08 — Воронка (уменьшающиеся ворота)
# Общие поля элемента. Вариант может переопределить любое из них.
id: C08
name_ru: "Воронка (уменьшающиеся ворота)"
name_en: "Funnel"
category: combos
scope: track            # track | indoor | outdoor | service
