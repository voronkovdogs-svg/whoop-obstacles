# C09 — Ворота с переменной шириной
# Общие поля элемента. Вариант может переопределить любое из них.
id: C09
name_ru: "Ворота с переменной шириной"
name_en: "Adjustable gate"
category: combos
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Две вертикальные стойки 30×30 мм высотой 650 мм симметрично скользят по базовому рельсу
  длиной 1200 мм. Нижняя и верхняя телескопические планки 30 мм задают проём высотой 500 мм
  (нижний край на 100 мм). Ширина проёма регулируется от 200 до 800 мм, по умолчанию 400.
real_analog: "регулируемые тренировочные ворота"
mount: floor           # floor | stand | hanging | wall | free
material: "алюминиевый профиль, пластик"
rigidity: hard         # soft | semi | hard — поведение при ударе вупа
color: "стойки и планки красные #E53935, рельс чёрный #212121"
difficulty: 2          # 1–5
notes: >-
  Сложность зависит от ширины: 800 — 1, 400 — 2, 250 — 4, 200 — 5. В симуляторе ширина —
  параметр, можно сужать по мере прогресса ученика.

