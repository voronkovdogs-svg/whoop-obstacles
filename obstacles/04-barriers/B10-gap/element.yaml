# B10 — Узкая щель
# Общие поля элемента. Вариант может переопределить любое из них.
id: B10
name_ru: "Узкая щель"
name_en: "Gap"
category: barriers
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Две вертикальные панели 600×1000 мм из пенокартона 10 мм стоят в одной плоскости, между
  ними — вертикальная щель на всю высоту. Кромки у щели обклеены белой лентой. Сзади у
  каждой панели треугольная подпорка глубиной 300 мм.
real_analog: "две панели с зазором"
mount: floor           # floor | stand | hanging | wall | free
material: "пенокартон, клейкая лента"
rigidity: semi         # soft | semi | hard — поведение при ударе вупа
color: "оранжевые #F57C00, кромки щели белые #FFFFFF"
difficulty: 4          # 1–5
notes: >-
  Габарит вупа с защитой около 90–100 мм: щель 150 мм оставляет по 25 мм с каждой стороны.
  Высота пролёта свободная — важна только точность по горизонтали.

