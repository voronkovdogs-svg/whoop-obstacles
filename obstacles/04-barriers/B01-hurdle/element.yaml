description: >-
  Горизонтальная планка из плавательной «лапши» Ø65 мм длиной 1000 мм лежит на открытых
  крючках двух вертикальных стоек Ø25 мм. Стойки стоят на Т-образных ножках глубиной 300 мм.
  Пролёт — над планкой.
real_analog: "лёгкоатлетический барьер / стойки с планкой из pool noodle"
mount: floor           # floor | stand | hanging | wall | free
