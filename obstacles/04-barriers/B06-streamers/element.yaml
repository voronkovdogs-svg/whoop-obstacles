# B06 — Свисающие ленты
# Общие поля элемента. Вариант может переопределить любое из них.
id: B06
name_ru: "Свисающие ленты"
name_en: "Streamer curtain"
category: barriers
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Перекладина длиной 1000 мм на высоте 1200 мм на двух стойках с Т-ножками. С перекладины
  свисают пластиковые ленты шириной 30 мм с шагом 50 мм, длина лент 900 мм — нижний край на
  высоте 300 мм.
real_analog: "ленточная шторка / занавес из лент"
mount: floor           # floor | stand | hanging | wall | free
material: "полиэтиленовая плёнка; стойки и перекладина — ПВХ-труба"
rigidity: soft         # soft | semi | hard — поведение при ударе вупа
color: "ленты чередуются: серебристые #CFD8DC и красные #E53935"
difficulty: 2          # 1–5
notes: >-
  Ленты проходимы: дрон пролетает сквозь них, они отклоняются и закрывают обзор на
  мгновение. Под лентами есть свободный просвет 300 мм. В симуляторе ленты — мягкие тела или
  простая анимация.

