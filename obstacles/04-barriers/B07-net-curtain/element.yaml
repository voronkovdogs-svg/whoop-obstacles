description: >-
  Лёгкая нейлоновая сетка (ячейка 50 мм) 1000×1000 мм, натянутая на перекладину и стойки,
  нижний край на высоте 100 мм. В центре сетки — квадратный вырез 300×300 мм в жёсткой
