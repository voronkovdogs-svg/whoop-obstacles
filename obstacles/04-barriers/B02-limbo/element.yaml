# B02 — Лимбо-планка (пролёт снизу)
# Общие поля элемента. Вариант может переопределить любое из них.
id: B02
name_ru: "Лимбо-планка (пролёт снизу)"
name_en: "Limbo bar"
category: barriers
scope: track            # track | indoor | outdoor | service
behavior: static        # static | dynamic
status: filled          # draft | filled | reviewed

description: >-
  Горизонтальная планка из ПВХ-трубы Ø25 мм длиной 1000 мм на двух стойках Ø25 мм, стойки
  выше планки на 100 мм. Т-образные ножки глубиной 300 мм. Пролёт — под планкой, между полом
  и планкой.
real_analog: "стойки с планкой для лимбо"
mount: floor           # floor | stand | hanging | wall | free
material: "ПВХ-труба; ножки — пластик"
rigidity: hard         # soft | semi | hard — поведение при ударе вупа
color: "планка в жёлто-чёрную полоску (#FDD835 / #212121), стойки чёрные"
difficulty: 3          # 1–5
notes: >-
  Низкая планка заставляет лететь у самого пола, где вуп теряет стабильность из-за
  отражённого потока. Ножки стоек выступают в проём на 150 мм вперёд и назад.

